<html>
<head>
    <title>A3d Oscillator</title>
    <style>        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #554433;
            color: #eee;
            padding: 15px;
            max-width: 820px;
            margin: 0 auto;
        }
        .container {
            background: #3d3228;
            padding: 14px;
            border-radius: 12px;
            position: relative;
        }
        /* Header with presets and lang switch */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .preset-buttons {
            display: flex;
            gap: 4px;
        }
        .preset-btn {
            background: transparent;
            border: none;
            color: #887766;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1.4;
        }
        .preset-btn:hover {
            color: #ee9933;
        }
        .preset-btn.active {
            color: #ffd700;
        }
        .preset-btn .tooltip {
            display: none;
            position: absolute;
            background: #2a1f16;
            color: #ee9933;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: normal;
            white-space: nowrap;
            margin-top: 18px;
            margin-left: -8px;
            border: 1px solid #ee9933;
            z-index: 10;
        }
        .preset-btn:hover .tooltip {
            display: block;
        }
        .preset-btn-wrapper {
            position: relative;
            display: inline-block;
        }
        .lang-switch {
            font-size: 13px;
            color: #ee9933;
            cursor: pointer;
            user-select: none;
        }
        .lang-switch span {
            padding: 0 4px;
        }
        .lang-switch .active {
            font-weight: bold;
            color: #ffd700;
        }
        .lang-switch .inactive {
            color: #887766;
        }
        .lang-switch .inactive:hover {
            color: #ee9933;
        }
        h2 {
            color: #ee9933;
            margin-top: 4px;
            text-align: center;
            font-size: 20px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 12px 0;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #4a3a2e;
            padding: 6px 15px;
            border-radius: 12px;
        }
        .control-group label {
            font-weight: bold;
            color: #ee9933;
            min-width: 110px;
            font-size: 13px;
        }
        .control-group input[type="range"] {
            flex: 1;
            margin: 0 8px;
            cursor: pointer;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            border-radius: 4px;
        }
        .control-group input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 4px;
            background: #93745a;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ee9933;
            border-radius: 40%;
            cursor: pointer;
            border: none;
            outline: none;
            margin-top: -6px;
            position: relative;
            z-index: 2;
        }
        .control-group input[type="range"]::-moz-range-track {
            height: 8px;
            border-radius: 4px;
            background: #93745a;
        }
        .control-group input[type="range"]::-moz-range-progress {
            height: 8px;
            border-radius: 4px 0 0 4px;
            background: #ee9933;
        }
        .control-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #ee9933;
            border-radius: 40%;
            cursor: pointer;
            border: none;
            outline: none;
        }
        .control-group input[type="text"] {
            width: 45px;
            background: #2a1f16;
            border: 1px solid #ee9933;
            color: #eee;
            padding: 3px 5px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }
        .control-group .value {
            min-width: 30px;
            text-align: right;
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
        }
        .harmonics {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 6px;
            background: #4a3a2e;
            border-radius: 12px;
            flex-wrap: nowrap;
        }
        .harmonics input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ee9933;
            cursor: pointer;
        }
        .harmonics label {
            color: #ee9933;
            cursor: pointer;
            font-size: 13px;
        }
        .harmonics .h-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .harmonics .h-group input[type="range"] {
            width: 30%;
            min-width: 50px;
            cursor: pointer;
        }
        .harmonics .h-group input[type="text"] {
            width: 20px;
            background: #2a1f16;
            border: 1px solid #ee9933;
            color: #eee;
            padding: 2px 4px;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin: 8px 0;
        }
        .button-row button {
            flex: 1;
            padding: 12px 20px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .button-row button:hover {
            transform: scale(1.02);
        }
        .button-row button:active {
            transform: scale(0.98);
        }
        .btn-start {
            background: linear-gradient(135deg, #ee9933, #cc5500);
            color: white;
        }
        .btn-start:hover {
            box-shadow: 0 4px 25px rgba(238, 119, 17, 0.4);
        }
        .btn-stop {
            background: linear-gradient(135deg, #cc3333, #991111);
            color: white;
        }
        .btn-stop:hover {
            box-shadow: 0 4px 25px rgba(204, 51, 51, 0.4);
        }
        .output {
            background: #10200e;
            border: 1px solid #5a4a3e;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            min-height: 60px;
            font-family: 'Consolas', monospace;
            color: #00ff88;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status {
            color: #ee9933;
            font-size: 13px;
            margin-top: 8px;
        }
        .dual {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .dual .control-group {
            flex: 1;
            min-width: 230px;
        }
        .full-width .control-group {
            flex: 1 1 100%;
        }
        .version {
            color: #887766;
            font-size: 12px;
            text-align: right;
            margin-top: 4px;
        }
        .lang-active {
            font-weight: bold;
            color: #ffd700;
        }
        .lang-inactive {
            color: #887766;
            cursor: pointer;
        }
        .lang-inactive:hover {
            color: #ee9933;
        }
        .level-meter-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #352a21;
            padding: 4px 15px;
            border-radius: 4px;
            margin: 8px 0;
        }
        .level-meter-container > label {
            font-weight: bold;
            color: #ee9933;
            min-width: 60px;
            font-size: 13px;
        }
        .level-meter-bar {
            flex: 1;
            height: 16px;
            background: #1a1209;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .level-meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: linear-gradient(90deg, #2ecc71 0%, #f1c40f 60%, #e74c3c 100%);
            transition: width 0.08s ease-out;
        }
        .level-meter-container .value {
            min-width: 60px;
            text-align: right;
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="preset-buttons">
                <span class="preset-btn-wrapper">
                    <button class="preset-btn active" data-preset="0" onclick="switchPreset(0)">①<span class="tooltip">Default</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="1" onclick="switchPreset(1)">②<span class="tooltip">Frogs</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="2" onclick="switchPreset(2)">③<span class="tooltip">Helicopter</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="3" onclick="switchPreset(3)">④<span class="tooltip">Alien</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="4" onclick="switchPreset(4)">⑤<span class="tooltip">Drone</span></button>
                </span>
            </div>
            <div class="lang-switch">
                <span id="langEng" class="lang-active" onclick="setLang('eng')">ENG</span>
                <span>|</span>
                <span id="langRus" class="lang-inactive" onclick="setLang('rus')">RUS</span>
            </div>
        </div>
        <h2 id="title">A3d Oscillator</h2>
        
        <div class="controls">
            <div class="control-group">
                <label id="lblCarrier">Carrier freq (Hz)</label>
                <input type="range" id="carrierFreq" min="20" max="10000" value="250" step="1">
                <input type="text" id="carrierFreqInput" value="250">
            </div>

            <div class="control-group">
                <label id="lblMod1">OSC-1 (AM) Hz</label>
                <input type="range" id="modFreq1" min="0.1" max="500" value="5" step="0.1">
                <input type="text" id="modFreq1Input" value="5.0">
            </div>

            <div class="control-group">
                <label id="lblMod2">OSC-2 (FM) Hz</label>
                <input type="range" id="modFreq2" min="0.1" max="1000" value="5" step="0.1">
                <input type="text" id="modFreq2Input" value="5.0">
            </div>
            
            <div class="control-group">
                <label id="lblDepth">AM depth</label>
                <input type="range" id="depth" min="0" max="100" value="50" step="1">
                <input type="text" id="depthInput" value="50">
            </div>

            <div class="control-group">
                <label id="lblFmDepth">FM depth (Hz)</label>
                <input type="range" id="fmDepth" min="0" max="10000" value="100" step="1">
                <input type="text" id="fmDepthInput" value="100">
            </div>
            
            <div class="control-group">
                <label id="lblDuration">Duration (sec)</label>
                <input type="range" id="duration" min="0.5" max="60" value="5" step="0.5">
                <input type="text" id="durationInput" value="5">
            </div>

            <div class="control-group">
                <label id="lblVolume">Volume</label>
                <input type="range" id="masterVolume" min="0" max="100" value="50" step="1">
                <input type="text" id="masterVolumeInput" value="50">
            </div>
            
            <div class="harmonics">
                <div class="control-group">
                    <input type="checkbox" id="harmonics2Check">
                    <label id="lblHarm2"><b>Harmonics:</b> 2nd</label>
                    <span class="h-group">
                    <input type="range" id="harmonics2Gain" min="0" max="100" value="10" step="0.1">
                    </span>
                    <input type="text" id="harmonics2GainInput" value="10">
                </div>
                <div class="control-group">
                    <input type="checkbox" id="harmonics3Check">
                    <label id="lblHarm3">3rd</label>
                    <span class="h-group">
                    <input type="range" id="harmonics3Gain" min="0" max="100" value="5" step="0.1">
                    </span>
                    <input type="text" id="harmonics3GainInput" value="10">
                </div>
            </div>
        </div>
        
        <div class="level-meter-container">
            <label id="lblLevel">Level</label>
            <div class="level-meter-bar">
                <div class="level-meter-fill" id="levelFill"></div>
            </div>
            <span class="value" id="levelVal">-∞ dB</span>
        </div>

        <div class="button-row">
            <button id="btnStart" class="btn-start" onclick="startAM()">Start modulation</button>
            <button id="btnStop" class="btn-stop" onclick="stopAllSounds()">Stop all sounds</button>
        </div>
        
        <div class="output" id="output">Ready</div>
        <div class="status" id="status">Waiting</div>
    </div>

    <script>
        // === CONSTANTS ===
        const VERSION = '0.1.5';
        const NAME = 'A3d Oscillator';
        
        // === PRESETS ===
        const PRESET_NAMES = ['Default', 'Frogs', 'Helicopter', 'Alien', 'Drone'];
        
        // Default preset values
        const DEFAULT_VALUES = {
            carrier: 300,
            mod1: 3,
            mod2: 30,
            depth: 70,
            fmDepth: 600,
            duration: 3,
            volume: 50,
            h2On: false,
            h2Gain: 3,
            h3On: false,
            h3Gain: 2
        };

        const PRESETS = [
            // 0: Default
            { ...DEFAULT_VALUES },
            // 1: Frogs
            {
                carrier: 2000,
                mod1: 40,
                mod2: 38,
                depth: 90,
                fmDepth: 3200,
                duration: 4,
                volume: 60,
                h2On: true,
                h2Gain: 20,
                h3On: true,
                h3Gain: 10
            },
            // 2: Helicopter
            {
                carrier: 110,
                mod1: 15,
                mod2: 0.4,
                depth: 90,
                fmDepth: 40,
                duration: 6,
                volume: 60,
                h2On: true,
                h2Gain: 6,
                h3On: true,
                h3Gain: 14
            },
            // 3: Alien / Sci-Fi
            {
                carrier: 1100,
                mod1: 1,
                mod2: 10,
                depth: 40,
                fmDepth: 600,
                duration: 5,
                volume: 40,
                h2On: true,
                h2Gain: 15,
                h3On: true,
                h3Gain: 30
            },
            // 4: Deep drone
            {
                carrier: 70,
                mod1: 0.4,
                mod2: 35,
                depth: 55,
                fmDepth: 70,
                duration: 10,
                volume: 60,
                h2On: true,
                h2Gain: 60,
                h3On: true,
                h3Gain: 40
            }
        ];

        let currentPreset = 0;

        // === CONFIG ===
        const CONFIG = {
            DEFAULT_CARRIER: 300,
            DEFAULT_MOD1: 3,
            DEFAULT_MOD2: 30,
            DEFAULT_DEPTH: 70,
            DEFAULT_FM_DEPTH: 600,
            DEFAULT_HARMONIC2_GAIN: 3,
            DEFAULT_HARMONIC3_GAIN: 2,
            DEFAULT_DURATION: 3,
            DEFAULT_VOLUME: 50,
            MIN_CARRIER: 20,
            MAX_CARRIER: 10000,
            MIN_MOD: 0.1,
            MAX_MOD: 500
        };

        // === LANGUAGE STRINGS ===
        const LANG = {
            eng: {
                title: 'A3d Oscillator',
                carrier: 'Carrier freq (Hz)',
                mod1: 'OSC-1 (AM) Hz',
                mod2: 'OSC-2 (FM) Hz',
                depth: 'AM depth',
                fmDepth: 'FM depth (Hz)',
                duration: 'Duration (sec)',
                volume: 'Volume',
                harm2: 'Harmonics: 2nd',
                harm3: '3rd',
                btn: 'Start modulation',
                btnStop: 'Stop all sounds',
                output: 'Ready',
                status: 'Waiting',
                running: 'Sound playing... stops in %s sec',
                stopped: 'Stopped by user',
                done: 'Done',
                carrierOut: 'Carrier: %s Hz',
                amOut: 'OSC-1 (AM): %s Hz, depth %s%',
                fmOut: 'OSC-2 (FM): %s Hz, depth %s Hz',
                durationOut: 'Duration: %s sec',
                harmonicsOut: 'Harmonics: %s',
                noHarmonics: 'none',
                volumeOut: 'Volume: %s%'
            },
            rus: {
                title: 'A3d Oscillator',
                carrier: 'Несущая частота (Гц)',
                mod1: 'ОСЦ-1 (AM) Гц',
                mod2: 'ОСЦ-2 (FM) Гц',
                depth: 'Глубина AM',
                fmDepth: 'Глубина FM (Гц)',
                duration: 'Длительность (сек)',
                volume: 'Громкость',
                harm2: 'Гармоники: 2-я',
                harm3: '3-я',
                btn: 'Старт модуляции',
                btnStop: 'Остановить всё',
                output: 'Готов',
                status: 'Ожидание',
                running: 'Звук воспроизводится... остановится через %s сек',
                stopped: 'Остановлено пользователем',
                done: 'Закончено',
                carrierOut: 'Несущая: %s Гц',
                amOut: 'ОСЦ-1 (AM): %s Гц, глубина %s%',
                fmOut: 'ОСЦ-2 (FM): %s Гц, глубина %s Гц',
                durationOut: 'Длительность: %s сек',
                harmonicsOut: 'Гармоники: %s',
                noHarmonics: 'нет',
                volumeOut: 'Громкость: %s%'
            }
        };

        let currentLang = 'eng';
        let audioContext = null;
        let masterGain = null;
        let analyserNode = null;
        let activeOscillators = [];
        let levelAnimFrame = null;
        let isPlaying = false;

        // === GET/SET SETTINGS ===
        function getCurrentSettings() {
            return {
                carrier: parseFloat(document.getElementById('carrierFreq').value),
                mod1: parseFloat(document.getElementById('modFreq1').value),
                mod2: parseFloat(document.getElementById('modFreq2').value),
                depth: parseFloat(document.getElementById('depth').value),
                fmDepth: parseFloat(document.getElementById('fmDepth').value),
                duration: parseFloat(document.getElementById('duration').value),
                volume: parseFloat(document.getElementById('masterVolume').value),
                h2On: document.getElementById('harmonics2Check').checked,
                h2Gain: parseFloat(document.getElementById('harmonics2Gain').value),
                h3On: document.getElementById('harmonics3Check').checked,
                h3Gain: parseFloat(document.getElementById('harmonics3Gain').value)
            };
        }

        function applySettings(s) {
            document.getElementById('carrierFreq').value = s.carrier;
            document.getElementById('carrierFreqInput').value = s.carrier;
            document.getElementById('modFreq1').value = s.mod1;
            document.getElementById('modFreq1Input').value = s.mod1;
            document.getElementById('modFreq2').value = s.mod2;
            document.getElementById('modFreq2Input').value = s.mod2;
            document.getElementById('depth').value = s.depth;
            document.getElementById('depthInput').value = s.depth;
            document.getElementById('fmDepth').value = s.fmDepth;
            document.getElementById('fmDepthInput').value = s.fmDepth;
            document.getElementById('duration').value = s.duration;
            document.getElementById('durationInput').value = s.duration;
            document.getElementById('masterVolume').value = s.volume;
            document.getElementById('masterVolumeInput').value = s.volume;
            document.getElementById('harmonics2Check').checked = s.h2On;
            document.getElementById('harmonics2Gain').value = s.h2Gain;
            document.getElementById('harmonics2GainInput').value = s.h2Gain;
            document.getElementById('harmonics3Check').checked = s.h3On;
            document.getElementById('harmonics3Gain').value = s.h3Gain;
            document.getElementById('harmonics3GainInput').value = s.h3Gain;
            
            // Update slider visuals
            updateAllSliders();
        }

        function updateAllSliders() {
            const ids = ['carrierFreq', 'modFreq1', 'modFreq2', 'depth', 'fmDepth', 'duration', 'masterVolume', 'harmonics2Gain', 'harmonics3Gain'];
            for (let id of ids) {
                let slider = document.getElementById(id);
                if (slider) updateSliderVisual(slider);
            }
        }

        function updateSliderVisual(slider) {
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            const value = parseFloat(slider.value);
            const percent = ((value - min) / (max - min)) * 100;
            slider.style.background = `linear-gradient(to right, #ee9933 0%, #ee9933 ${percent}%, #93745a ${percent}%, #93745a 100%)`;
            slider.style.backgroundSize = '100% 6px';
            slider.style.backgroundPosition = '0 0';
            slider.style.backgroundRepeat = 'no-repeat';
        }

        // === PRESET SWITCH ===
        function switchPreset(idx) {
            // Save current preset before switching
            saveCurrentPreset();
            
            currentPreset = idx;
            
            // Update button styles
            document.querySelectorAll('.preset-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });
            
            // Apply preset
            applySettings(PRESETS[idx]);
        }

        function saveCurrentPreset() {
            PRESETS[currentPreset] = getCurrentSettings();
        }

        // === LANGUAGE SWITCH ===
        function setLang(lang) {
            currentLang = lang;
            document.getElementById('langEng').className = lang === 'eng' ? 'lang-active' : 'lang-inactive';
            document.getElementById('langRus').className = lang === 'rus' ? 'lang-active' : 'lang-inactive';
            updateLabels();
            updateOutput();
        }

        function t(key) {
            return LANG[currentLang][key] || key;
        }

        function updateLabels() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('lblCarrier').textContent = t('carrier');
            document.getElementById('lblMod1').textContent = t('mod1');
            document.getElementById('lblMod2').textContent = t('mod2');
            document.getElementById('lblDepth').textContent = t('depth');
            document.getElementById('lblFmDepth').textContent = t('fmDepth');
            document.getElementById('lblDuration').textContent = t('duration');
            document.getElementById('lblVolume').textContent = t('volume');
            document.getElementById('lblHarm2').textContent = t('harm2');
            document.getElementById('lblHarm3').textContent = t('harm3');
            document.getElementById('btnStart').textContent = t('btn');
            document.getElementById('btnStop').textContent = t('btnStop');
            document.getElementById('status').textContent = t('status');
        }

        function updateOutput() {
            let output = document.getElementById('output');
            if (output.textContent === 'Ready' || output.textContent === 'Готов') {
                output.textContent = t('output');
            }
        }

        // === INIT AUDIO CONTEXT ===
        function initAudio() {
            if (!audioContext || audioContext.state === 'closed') {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.gain.value = 1.0;
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 2048;
                masterGain.connect(analyserNode);
                analyserNode.connect(audioContext.destination);
            }
        }

        // === STOP ALL SOUNDS ===
        function stopAllSounds() {
            if (levelAnimFrame) {
                cancelAnimationFrame(levelAnimFrame);
                levelAnimFrame = null;
            }
            
            const levelFill = document.getElementById('levelFill');
            const levelVal = document.getElementById('levelVal');
            if (levelFill) levelFill.style.width = '0%';
            if (levelVal) levelVal.textContent = '-∞ dB';

            for (let osc of activeOscillators) {
                try { osc.stop(); } catch(e) {}
                try { osc.disconnect(); } catch(e) {}
            }
            activeOscillators = [];
            
            isPlaying = false;
            document.getElementById('status').textContent = t('stopped');
            
            let output = document.getElementById('output');
            if (!output.textContent.includes('Stopped') && !output.textContent.includes('Остановлено')) {
                output.textContent = output.textContent + '\n' + '--- ' + t('stopped') + ' ---';
            }
        }

        // === LEVEL METER ===
        function updateLevelMeter() {
            if (!analyserNode || !isPlaying) return;

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Float32Array(bufferLength);
            const levelFill = document.getElementById('levelFill');
            const levelVal = document.getElementById('levelVal');

            function drawLevel() {
                if (!isPlaying || !analyserNode) {
                    levelFill.style.width = '0%';
                    levelVal.textContent = '-∞ dB';
                    return;
                }
                
                levelAnimFrame = requestAnimationFrame(drawLevel);

                analyserNode.getFloatTimeDomainData(dataArray);

                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i] * dataArray[i];
                }
                const rms = Math.sqrt(sum / bufferLength);

                let db = 20 * Math.log10(rms);
                if (db < -60) db = -60;
                if (db > 0) db = 0;

                const pct = ((db + 60) / 60) * 100;
                levelFill.style.width = pct + '%';

                if (db < -59) {
                    levelVal.textContent = '-∞ dB';
                } else {
                    levelVal.textContent = db.toFixed(1) + ' dB';
                }
            }

            drawLevel();
        }

        // === SLIDER SETUP ===
        function setupSlider(inputId, inputIdText, valId) {
            let slider = document.getElementById(inputId);
            let input = document.getElementById(inputIdText);
            let val = document.getElementById(valId);
            
            function updateSlider() {
                const min = parseFloat(slider.min);
                const max = parseFloat(slider.max);
                const value = parseFloat(slider.value);
                const percent = ((value - min) / (max - min)) * 100;

                slider.style.background = `linear-gradient(to right, #ee9933 0%, #ee9933 ${percent}%, #93745a ${percent}%, #93745a 100%)`;
                slider.style.backgroundSize = '100% 6px';
                slider.style.backgroundPosition = '0 0';
                slider.style.backgroundRepeat = 'no-repeat';

                if (input) input.value = value;
                if (val) val.textContent = value;
                
                // Auto-save on any slider change
                saveCurrentPreset();
            }

            if (slider) {
                slider.addEventListener('input', updateSlider);
                if (input) {
                    input.addEventListener('change', function() {
                        let v = parseFloat(this.value);
                        if (isNaN(v) || v < parseFloat(slider.min) || v > parseFloat(slider.max)) {
                            this.style.borderColor = 'red';
                            return;
                        }
                        this.style.borderColor = '#ee9933';
                        slider.value = v;
                        updateSlider();
                    });
                }
                updateSlider();
            }
        }

        // === SET DEFAULTS ===
        function setDefault(id, value) {
            let el = document.getElementById(id);
            if (el) el.value = value;
        }

        // Apply default preset on load
        applySettings(PRESETS[0]);

        // === SETUP SLIDERS ===
        setupSlider('carrierFreq', 'carrierFreqInput', 'carrierFreqVal');
        setupSlider('modFreq1', 'modFreq1Input', 'modFreq1Val');
        setupSlider('modFreq2', 'modFreq2Input', 'modFreq2Val');
        setupSlider('depth', 'depthInput', 'depthVal');
        setupSlider('fmDepth', 'fmDepthInput', 'fmDepthVal');
        setupSlider('duration', 'durationInput', 'durationVal');
        setupSlider('masterVolume', 'masterVolumeInput', 'masterVolumeVal');
        setupSlider('harmonics2Gain', 'harmonics2GainInput', 'harmonics2GainVal');
        setupSlider('harmonics3Gain', 'harmonics3GainInput', 'harmonics3GainVal');

        // Also save on checkbox changes
        document.getElementById('harmonics2Check').addEventListener('change', saveCurrentPreset);
        document.getElementById('harmonics3Check').addEventListener('change', saveCurrentPreset);

        // === START FUNCTION ===
        function startAM() {
            initAudio();
            
            let carrierFreq = parseFloat(document.getElementById('carrierFreq').value);
            let modFreq1 = parseFloat(document.getElementById('modFreq1').value);
            let modFreq2 = parseFloat(document.getElementById('modFreq2').value);
            let depthAM = parseFloat(document.getElementById('depth').value) / 100;
            let fmDepth = parseFloat(document.getElementById('fmDepth').value);
            let duration = parseFloat(document.getElementById('duration').value);
            let masterVolume = parseFloat(document.getElementById('masterVolume').value) / 100;
            let h2On = document.getElementById('harmonics2Check').checked;
            let h3On = document.getElementById('harmonics3Check').checked;
            let h2Gain = parseFloat(document.getElementById('harmonics2Gain').value) / 100;
            let h3Gain = parseFloat(document.getElementById('harmonics3Gain').value) / 100;
            
            let when = audioContext.currentTime + 0.1;
            
            // --- НЕСУЩАЯ (carrier) ---
            let carrier = audioContext.createOscillator();
            carrier.frequency.value = carrierFreq;

            let modulator1 = audioContext.createOscillator();
            modulator1.frequency.value = modFreq1;

            let modulator2 = audioContext.createOscillator();
            modulator2.frequency.value = modFreq2;

            // --- FM для несущей ---
            let fmGain = audioContext.createGain();
            fmGain.gain.value = fmDepth * masterVolume;
            modulator2.connect(fmGain);
            fmGain.connect(carrier.frequency);

            // --- AM для несущей ---
            let gainNode = audioContext.createGain();
            gainNode.gain.value = 0.5 * masterVolume;

            let depthNode = audioContext.createGain();
            depthNode.gain.value = depthAM * 0.5 * masterVolume;

            modulator1.connect(depthNode);
            depthNode.connect(gainNode.gain);
            carrier.connect(gainNode);
            gainNode.connect(masterGain);

            let oscillators = [carrier, modulator1, modulator2];

            // --- ВТОРАЯ ГАРМОНИКА ---
            let harmonic2 = null;
            let harmonic2Gain = null;

            if (h2On && h2Gain > 0) {
                harmonic2 = audioContext.createOscillator();
                harmonic2.frequency.value = carrierFreq * 2;
                oscillators.push(harmonic2);
                
                harmonic2Gain = audioContext.createGain();
                harmonic2Gain.gain.value = h2Gain * masterVolume;
                
                // --- FM ДЛЯ ГАРМОНИКИ (используем ТОТ ЖЕ modulator2) ---
                let fmGainH2 = audioContext.createGain();
                fmGainH2.gain.value = fmDepth * masterVolume;
                modulator2.connect(fmGainH2);
                fmGainH2.connect(harmonic2.frequency);
                
                // --- AM ДЛЯ ГАРМОНИКИ (используем ТОТ ЖЕ depthNode) ---
                // Гармоника подключается к ТОМУ ЖЕ gainNode, что и несущая
                harmonic2.connect(harmonic2Gain);
                harmonic2Gain.connect(gainNode); // <- ИДЁТ В ТОТ ЖЕ AM
            }

            // --- ТРЕТЬЯ ГАРМОНИКА ---
            let harmonic3 = null;
            let harmonic3Gain = null;

            if (h3On && h3Gain > 0) {
                harmonic3 = audioContext.createOscillator();
                harmonic3.frequency.value = carrierFreq * 3;
                oscillators.push(harmonic3);
                
                harmonic3Gain = audioContext.createGain();
                harmonic3Gain.gain.value = h3Gain * masterVolume;
                
                // --- FM ДЛЯ ГАРМОНИКИ ---
                let fmGainH3 = audioContext.createGain();
                fmGainH3.gain.value = fmDepth * masterVolume;
                modulator2.connect(fmGainH3);
                fmGainH3.connect(harmonic3.frequency);
                
                // --- AM ДЛЯ ГАРМОНИКИ ---
                harmonic3.connect(harmonic3Gain);
                harmonic3Gain.connect(gainNode); // <- ТОТ ЖЕ AM
            }
            
            for (let osc of oscillators) {
                osc.start(when);
            }
            
            activeOscillators.push(...oscillators);
            isPlaying = true;

            updateLevelMeter();
            
            let stopTime = when + duration;
            for (let osc of oscillators) {
                osc.stop(stopTime);
            }
            
            setTimeout(() => {
                activeOscillators = activeOscillators.filter(o => !oscillators.includes(o));
                if (activeOscillators.length === 0) {
                    isPlaying = false;
                    const levelFill = document.getElementById('levelFill');
                    const levelVal = document.getElementById('levelVal');
                    if (levelFill) levelFill.style.width = '0%';
                    if (levelVal) levelVal.textContent = '-∞ dB';
                    if (levelAnimFrame) {
                        cancelAnimationFrame(levelAnimFrame);
                        levelAnimFrame = null;
                    }
                }
            }, duration * 1000 + 100);
            
            let h2Text = h2On ? '2nd: ' + (carrierFreq*2).toFixed(0) + ' Hz (' + (h2Gain*100).toFixed(0) + '%)' : '';
            let h3Text = h3On ? '3rd: ' + (carrierFreq*3).toFixed(0) + ' Hz (' + (h3Gain*100).toFixed(0) + '%)' : '';
            let harmonicsText = [h2Text, h3Text].filter(s => s).join(', ') || t('noHarmonics');
            
            let output = document.getElementById('output');
            output.textContent = 
                '------------------------------------\n' +
                t('carrierOut').replace('%s', carrierFreq) + '\n' +
                t('amOut').replace('%s', modFreq1).replace('%s', (depthAM * 100).toFixed(0)) + '\n' +
                t('fmOut').replace('%s', modFreq2).replace('%s', fmDepth) + '\n' +
                t('durationOut').replace('%s', duration) + '\n' +
                t('volumeOut').replace('%s', (masterVolume * 100).toFixed(0)) + '\n' +
                t('harmonicsOut').replace('%s', harmonicsText) + '\n' +
                '------------------------------------';
            
            document.getElementById('status').textContent = t('running').replace('%s', duration);
            
            setTimeout(() => {
                document.getElementById('status').textContent = t('done');
            }, duration * 1000);
        }
    </script>
