<html>
<head>
    <title>a3d Oscillator</title>
    <style>        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #554433;
            color: #eee;
            padding: 10px;
            max-width: 820px;
            margin: 3 auto;
        }

        a {
        color:  #ffd700;
        text-decoration: none;  
        }

        a:visited {
        color: #dd8822;
        }

        a:hover {
        color:  #ffeebb;
        text-decoration: underline;
        }

        a:active {
        color: #ee9933;
        }
        
        .container {
            background: #3d3228;
            padding: 12px;
            padding-bottom: 8px;
            border-radius: 10px;
            position: relative;
        }
        /* Header with presets and lang switch */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .preset-buttons {
            display: flex;
            gap: 4px;
        }
        .preset-btn {
            background: transparent;
            border: none;
            color: #887766;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1.4;
        }
        .preset-btn:hover {
            color: #ee9933;
        }
        .preset-btn.active {
            color: #ffd700;
        }
        .preset-btn .tooltip {
            display: none;
            position: absolute;
            background: #2a1f16;
            color: #ee9933;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: normal;
            white-space: nowrap;
            margin-top: 18px;
            margin-left: -8px;
            border: 1px solid #ee9933;
            z-index: 10;
        }
        .preset-btn:hover .tooltip {
            display: block;
        }
        .preset-btn-wrapper {
            position: relative;
            display: inline-block;
        }
        .lang-switch {
            font-size: 13px;
            color: #ee9933;
            cursor: pointer;
            user-select: none;
        }
        .lang-switch span {
            padding: 0 4px;
        }
        .lang-switch .active {
            font-weight: bold;
            color: #ffd700;
        }
        .lang-switch .inactive {
            color: #887766;
        }
        .lang-switch .inactive:hover {
            color: #ee9933;
        }
        h3 {
            color: #ee9933;
            margin-top: 4px;
            text-align: center;
            font-size: 15px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 12px 0px 0px 0px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #4a3a2e;
            padding: 6px 15px;
            border-radius: 12px;
        }
        .control-group label {
            font-weight: bold;
            color: #ee9933;
            min-width: 110px;
            font-size: 13px;
        }
        .control-group-short {
            font-weight: bold;
            color: #ee9933;
            min-width: 40px;
            font-size: 13px;
        }        
        .control-group input[type="range"] {
            flex: 1;
            margin: 0 8px;
            cursor: pointer;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            border-radius: 4px;
        }
        .control-group input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 4px;
            background: #93745a;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ee9933;
            border-radius: 40%;
            cursor: pointer;
            border: none;
            outline: none;
            margin-top: -6px;
            position: relative;
            z-index: 2;
        }
        .control-group input[type="range"]::-moz-range-track {
            height: 8px;
            border-radius: 4px;
            background: #93745a;
        }
        .control-group input[type="range"]::-moz-range-progress {
            height: 8px;
            border-radius: 4px 0 0 4px;
            background: #ee9933;
        }
        .control-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #ee9933;
            border-radius: 40%;
            cursor: pointer;
            border: none;
            outline: none;
        }
        .control-group input[type="text"] {
            width: 45px;
            background: #2a1f16;
            border: 1px solid #ee9933;
            color: #eee;
            padding: 3px 5px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }
        .control-group input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #ee9933;
            cursor: pointer;
        }        
        .control-group .value {
            min-width: 30px;
            text-align: right;
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
        }
        .harmonics {
            display: flex;
            align-items: center;
            gap: 1px;
            padding: 0px 0px;
            background: #4a3a2e;
            border-radius: 12px;
            flex-wrap: nowrap;
        }
        .harmonics input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #ee9933;
            cursor: pointer;
        }
        .harmonics label {
            color: #ee9933;
            cursor: pointer;
            font-size: 13px;
        }
        .harmonics .h-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .harmonics .h-group input[type="range"] {
            width: 50%;
            min-width: 50px;
            cursor: pointer;
        }
        .harmonics .h-group input[type="text"] {
            width: 20px;
            background: #2a1f16;
            border: 1px solid #ee9933;
            color: #eee;
            padding: 2px 4px;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
        }
        .harmonics .tooltip {
            display: none;
            position: absolute;
            background: #2a1f16;
            color: #ee9933;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            margin-top: 18px;
            margin-left: -8px;
            border: 1px solid #ee9933;
            z-index: 10;
        }
        .harmonics:hover .tooltip {
            display: block;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin: 8px 2px;
        }
        .button-row button {
            flex: 1;
            padding: 12px 20px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .button-row button:hover {
            transform: scale(1.0);
        }
        .button-row button:active {
            transform: scale(1.);
        }
        .btn-start {
            background: linear-gradient(135deg, #d08020, #b06000);
/*            color: #3d3238; */
            color: white;
        }
        .btn-start:hover {
/*            box-shadow: 0 4px 25px rgba(238, 119, 17, 0.4); */
            background: linear-gradient(135deg, #ffbb44, #de7611);

        }
        .btn-stop {
            background: linear-gradient(135deg, #ee5544, #bb3322);
            color: white;
/*            color: #3d3238; */
        }
        .btn-stop:hover {
/*            box-shadow: 0 4px 25px rgba(204, 51, 51, 0.4); */
            background: linear-gradient(135deg, #dd4433, #aa2211);

        }
        .output {
            background: #10200e;
            border: 1px solid #5a4a3e;
            border-radius: 8px;
            padding: 12px;
            margin: 4px 0;
            min-height: 60px;
            font-family: 'Consolas', monospace;
            color: #22ff88;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status {
            color: #ee9933;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            margin-top: 4px;
            margin-left: 4px;
        }
        .dual {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .dual .control-group {
            flex: 1;
            min-width: 230px;
        }
        .full-width .control-group {
            flex: 1 1 100%;
        }
        .version {
            color: #887766;
            font-size: 12px;
            text-align: right;
            margin-top: 4px;
        }
        .lang-active {
            font-weight: bold;
            color: #ffd700;
        }
        .lang-inactive {
            color: #887766;
            cursor: pointer;
        }
        .lang-inactive:hover {
            color: #ee9933;
        }
        .level-meter-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #352a21;
            padding: 4px 15px;
            border-radius: 4px;
            margin: 2px 0px;
        }
        .level-meter-container > label {
            font-weight: bold;
            color: #ee9933;
            min-width: 60px;
            font-size: 13px;
        }
        .level-meter-bar {
            flex: 1;
            height: 16px;
            background: #1a1209;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .level-meter-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
/*            background: linear-gradient(90deg, #2ecc71 0%, #f1c40f 60%, #e74c3c 100%); */
            background: #ee9933;
            transition: width 0.08s ease-out;
        }
        .level-meter-container .value {
            min-width: 60px;
            text-align: right;
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
        }

/* Стили для блока огибающей (Envelope styling) */
        .envelope-section {
            background: #4a3a2e;
            padding: 15px;
            border-radius: 12px;
            margin: 0px 0;
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .env-time-row, .env-amp-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .env-time-row label, .env-amp-row label {
            font-weight: bold;
            color: #ee9933;
            min-width: 80px;
            font-size: 15px;
        }
        .time-sliders {
            flex: 1;
            position: relative;
            height: 20px;
        }
        /* Наложение ползунков друг на друга для оси X */
        .time-sliders input[type="range"] {
            position: absolute;
            width: 100%;
            top: 5px;
            left: 0;
            background: transparent;
            pointer-events: none; /* Чтобы клики проходили сквозь пустые зоны */
        }
        .time-sliders input[type="range"]::-webkit-slider-thumb {
            pointer-events: auto; /* Включаем клики только для самих ползунков */
            background: #ee9933;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        /* Добавляем этот блок для Firefox */
        .time-sliders input[type="range"]::-moz-range-thumb {
            pointer-events: auto; /* Включаем клики для ползунков в Firefox */
            background: #ee9933;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none; /* Убираем стандартную рамку FF */
            cursor: pointer;
        }

        .env-time-inputs {
            display: flex;
            justify-content: space-between;
            padding-left: 90px; /* Выравнивание под ползунками */
        }
        .env-time-inputs input, .env-amp-row input {
            width: 50px;
            background: #1a1209;
            border: 1px solid #ee9933;
            color: #eee;
            padding: 3px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }
        .canvas-container {
            width: 99%;
            background: #1a1209;
            border: 1px solid #5a4a3e;
            border-radius: 8px;
            padding: 5px;
        }
        canvas {
            width: 100%;
            height: 100px;
            display: block;
        }

        /* 
           Сетка для шапки. 
           1fr - левая колонка (занимает всё свободное место до центра)
           auto - центральная колонка (по размеру текста заголовка)
           1fr - правая колонка (симметрична левой)
        */
        .header-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Выравнивание левого блока с пресетами (Align presets to the left) */
        .preset-buttons {
            display: flex;
            gap: 4px;
            justify-content: flex-start;
        }

        /* Выравнивание и сброс отступов заголовка (Center title and reset margins) */
        #title {
            color: #ee9933;
            margin: 0; 
            text-align: center;
            font-size: 16px;
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        .views-badge {
            height: 1em;
            opacity: 0.6;
            margin-top: 2px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header-grid">            
            <!-- Левая часть: Пресеты (Left side: Presets) -->
            <div class="preset-buttons">
                <span class="preset-btn-wrapper">
                    <button class="preset-btn active" data-preset="0" onclick="switchPreset(0)">①<span class="tooltip">Default</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="1" onclick="switchPreset(1)">②<span class="tooltip">Frogs</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="2" onclick="switchPreset(2)">③<span class="tooltip">Helicopter</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="3" onclick="switchPreset(3)">④<span class="tooltip">Alien</span></button>
                </span>
                <span class="preset-btn-wrapper">
                    <button class="preset-btn" data-preset="4" onclick="switchPreset(4)">⑤<span class="tooltip">Drone</span></button>
                </span>
            </div>            
            <!-- Центр: Заголовок (Center: Title) -->
            <h3 id="title"><a href="https://antony3d.github.io/a3d-sound-oscillator">a3d Oscillator</a></h3>
            <!-- Правая часть: Счетчик и язык (Right side: Badge and Language switch) -->
            <div class="header-right">
                <img class="views-badge" src="https://vbr.nathanchung.dev/badge?page_id=antonio3d-modulator&style=flat-square&text=·%20&color=3d3228&lcolor=3d3228">
                
                <div class="lang-switch">
                    <span id="langEng" class="lang-active" onclick="setLang('eng')">ENG</span>
                    <span>|</span>
                    <span id="langRus" class="lang-inactive" onclick="setLang('rus')">RUS</span>
                </div>
            </div>            
        </div>
        
        
        <div class="controls">
            <div class="control-group">
                <label id="lblCarrier">Carrier freq (Hz)</label>
                <input type="range" id="carrierFreq" min="20" max="10000" value="250" step="1">
                <input type="text" id="carrierFreqInput" value="250">
            </div>

            <div class="control-group">
                <label id="lblMod1">OSC-1 (AM) Hz</label>
                <input type="range" id="modFreq1" min="0.1" max="500" value="5" step="0.1">
                <input type="text" id="modFreq1Input" value="5.0">
            </div>

            <div class="control-group">
                <label id="lblMod2">OSC-2 (FM) Hz</label>
                <input type="range" id="modFreq2" min="0.1" max="1000" value="5" step="0.1">
                <input type="text" id="modFreq2Input" value="5.0">
            </div>
            
            <div class="control-group">
                <label id="lblDepth">AM depth</label>
                <input type="range" id="depth" min="0" max="100" value="50" step="1">
                <input type="text" id="depthInput" value="50">
            </div>

            <div class="control-group">
                <label id="lblFmDepth">FM depth (Hz)</label>
                <input type="range" id="fmDepth" min="0" max="10000" value="100" step="1">
                <input type="text" id="fmDepthInput" value="100">
            </div>
            
            <div class="control-group">
                <label id="lblVolume">Volume</label>
                <input type="range" id="masterVolume" min="0" max="100" value="50" step="1">
                <input type="text" id="masterVolumeInput" value="50">
            </div>
            
            <div class="harmonics">
                <div class="control-group">
                    <input type="checkbox" id="harmonics2Check">
                    <label id="lblHarm2"><b>Harmonics:</b> 2nd</label>
                    <span class="h-group">
                    <input style="width: 180px;" type="range" id="harmonics2Gain" min="0" max="100" value="10" step="0.1">
                    </span>
                    <input type="text" id="harmonics2GainInput" value="10">
                </div>
                <div class="control-group">
                    <input type="checkbox" id="harmonics3Check">
                    <span class="control-group-short">
                        <label id="lblHarm3">3rd</label>
                    </span>
                    <span class="h-group">
                    <input style="width: 180px;" type="range" id="harmonics3Gain" min="0" max="100" value="5" step="0.1">
                    </span>
                    <input type="text" id="harmonics3GainInput" value="10">
                </div>
            </div>

<!--            <div class="harmonics"> -->
                <div class="control-group">
                    <label id="lblDuration">Duration (sec)</label>                    
                    <input type="range" id="duration" min="0.1" max="120" value="5" step="0.1">
                    <input type="text" id="durationInput" value="5">
                    <input type="checkbox" id="envelopeCheck">
                    <label id="lblEnvelope">Envelope</label>
                </div>
<!-- </div> -->           
        <!-- Блок огибающей амплитуды (Amplitude Envelope Section) -->
        <div class="envelope-section">
            <div class="control-group">
                <label>Time</label>
                <div class="time-sliders">
                    <input type="range" id="envTime1" min="0.1" max="99.6" step="0.1" value="0.1">
                    <input type="range" id="envTime2" min="0.2" max="99.7" step="0.1" value="40.0">
                    <input type="range" id="envTime3" min="0.3" max="99.8" step="0.1" value="60.0">
                    <input type="range" id="envTime4" min="0.4" max="99.9" step="0.1" value="99.9">
                </div>
            </div>
            
            <div class="env-time-inputs">
                <input type="text" id="envTimeIn1" value="0.1%">
                <input type="text" id="envTimeIn2" value="40%">                
                <input type="text" id="envTimeIn3" value="60%">
                <input type="text" id="envTimeIn4" value="99.9%">
            </div>

            <div class="canvas-container">
                <canvas id="envCanvas" width="760" height="150"></canvas>
            </div>

            <div class="env-amp-row">
                <label>Envelope</label>
                <input type="text" id="envAmp0" value="0%">
                <input type="text" id="envAmp1" value="70%">
                <input type="text" id="envAmp2" value="80%">                
                <input type="text" id="envAmp3" value="95%">
                <input type="text" id="envAmp4" value="50%">
                <input type="text" id="envAmp5" value="0%">
            </div>
        </div>
        <div class="button-row">
            <button id="btnStart" class="btn-start" onclick="startAM()">Start modulation</button>
            <button id="btnStop" class="btn-stop" onclick="stopAllSounds()">Stop all sounds</button>
        </div>
        <div class="level-meter-container">
            <label id="lblLevel">Level</label>
            <div class="level-meter-bar">
                <div class="level-meter-fill" id="levelFill"></div>
            </div>
            <span class="value" id="levelVal">-∞ dB</span>
        </div>
        <div class="output" id="output">Ready</div>
        <div class="status" id="status">Waiting</div>
    </div>
</div>

    <script>
        // === CONSTANTS ===
        const VERSION = '0.2.2';
        const NAME = 'a3d Oscillator';
        document.title = `${NAME} v${VERSION}`;        
        
        // === PRESETS ===
        const PRESET_NAMES = ['Default', 'Frogs', 'Helicopter', 'Alien', 'Drone'];
        
        // Default preset values
        const DEFAULT_VALUES = {
            carrier: 300,
            mod1: 3,
            mod2: 30,
            depth: 70,
            fmDepth: 600,
            duration: 3,
            volume: 50,
            h2On: false,
            h2Gain: 3,
            h3On: false,
            h3Gain: 2
        };

        const PRESETS = [
            // 0: Default
            { ...DEFAULT_VALUES },
            // 1: Frogs
            {
                carrier: 2000,
                mod1: 40,
                mod2: 38,
                depth: 90,
                fmDepth: 3200,
                duration: 4,
                volume: 60,
                h2On: true,
                h2Gain: 20,
                h3On: true,
                h3Gain: 10
            },
            // 2: Helicopter
            {
                carrier: 110,
                mod1: 15,
                mod2: 0.4,
                depth: 90,
                fmDepth: 40,
                duration: 6,
                volume: 60,
                h2On: true,
                h2Gain: 6,
                h3On: true,
                h3Gain: 14
            },
            // 3: Alien / Sci-Fi
            {
                carrier: 1100,
                mod1: 1,
                mod2: 10,
                depth: 40,
                fmDepth: 600,
                duration: 5,
                volume: 40,
                h2On: true,
                h2Gain: 15,
                h3On: true,
                h3Gain: 30
            },
            // 4: Deep drone
            {
                carrier: 70,
                mod1: 0.4,
                mod2: 35,
                depth: 55,
                fmDepth: 70,
                duration: 10,
                volume: 60,
                h2On: true,
                h2Gain: 60,
                h3On: true,
                h3Gain: 40
            }
        ];

        let currentPreset = 0;

        // === CONFIG ===
        const CONFIG = {
            DEFAULT_CARRIER: 300,
            DEFAULT_MOD1: 3,
            DEFAULT_MOD2: 30,
            DEFAULT_DEPTH: 70,
            DEFAULT_FM_DEPTH: 600,
            DEFAULT_HARMONIC2_GAIN: 3,
            DEFAULT_HARMONIC3_GAIN: 2,
            DEFAULT_DURATION: 3,
            DEFAULT_VOLUME: 50,
            MIN_CARRIER: 20,
            MAX_CARRIER: 10000,
            MIN_MOD: 0.1,
            MAX_MOD: 500
        };

        // === LANGUAGE STRINGS ===
        const LANG = {
            eng: {
                carrier: 'Carrier freq (Hz)',
                mod1: 'OSC-1 (AM) Hz',
                mod2: 'OSC-2 (FM) Hz',
                depth: 'AM depth',
                fmDepth: 'FM depth (Hz)',
                duration: 'Duration (sec)',

        // Хранит 5 точек. X = время в %, Y = амплитуда в %
        let AMP_Envelope = [
            { x: 0, y: 0 },
            { x: 0.1, y: 70 },

        // === ИНИЦИАЛИЗАЦИЯ И ОТРИСОВКА (CANVAS DRAWING) ===
        function drawEnvelope() {
            const canvas = document.getElementById('envCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            // Очищаем холст (Clear canvas)
            ctx.clearRect(0, 0, w, h);

            // Рисуем сетку (Draw grid)
            ctx.strokeStyle = '#3d3228';
            ctx.lineWidth = 1;
            for(let i=1; i<10; i++) {
                ctx.beginPath();
                ctx.moveTo(w * (i/10), 0);
                ctx.lineTo(w * (i/10), h);
                ctx.stroke();
            }

            // Рисуем кривую огибающей (Draw envelope path)
            ctx.beginPath();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;

            for (let i = 0; i < AMP_Envelope.length; i++) {
                // Переводим проценты в координаты пикселей
                // Y инвертирован, так как 0 в canvas - это верхний край
                let px = (AMP_Envelope[i].x / 100) * w;
                let py = h - ((AMP_Envelope[i].y / 100) * h);

                if (i === 0) {
                    ctx.moveTo(px, py);
                } else {
                    // Используем линии для точного соответствия linearRampToValueAtTime
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            // Рисуем маркеры точек (Draw points/markers)
            ctx.fillStyle = '#eee';
            for (let i = 0; i < AMP_Envelope.length; i++) {
                let px = (AMP_Envelope[i].x / 100) * w;
                let py = h - ((AMP_Envelope[i].y / 100) * h);
                ctx.fillRect(px - 3, py - 3, 6, 6);
            }
        }

        // === ОБНОВЛЕНИЕ ДАННЫХ ИЗ ИНТЕРФЕЙСА (UI LISTENERS) ===
        function updateEnvelopeData() {

            let t1 = parseFloat(document.getElementById('envTime1').value);
            let t2 = parseFloat(document.getElementById('envTime2').value);
            let t3 = parseFloat(document.getElementById('envTime3').value);
            let t4 = parseFloat(document.getElementById('envTime4').value);            

            // Защита от перехлеста: точки не должны обгонять друг друга
            if (t1 > t2) { t1 = t2; document.getElementById('envTime1').value = t1; }
            if (t2 > t3) { t2 = t3; document.getElementById('envTime2').value = t2; }
            if (t3 > t4) { t3 = t4; document.getElementById('envTime2').value = t3; }

            // Обновляем текстовые поля с добавлением символа %
            document.getElementById('envTimeIn1').value = t1 + '%';
            document.getElementById('envTimeIn2').value = t2 + '%';
            document.getElementById('envTimeIn3').value = t3 + '%';
            document.getElementById('envTimeIn4').value = t4 + '%';            

            // Обновляем координаты X в нашем массиве
            AMP_Envelope[1].x = t1;
            AMP_Envelope[2].x = t2;
            AMP_Envelope[3].x = t3;
            AMP_Envelope[4].x = t4;            

            // Читаем амплитуды из нижних инпутов (Read amplitude inputs)
            for (let i = 0; i < 5; i++) {
                let val = parseFloat(document.getElementById('envAmp' + i).value.replace('%',''));
                if (!isNaN(val)) {
                    // Ограничиваем от 0 до 100
                    val = Math.max(0, Math.min(100, val));
                    AMP_Envelope[i].y = val;
                    // Возвращаем красиво отформатированное значение в инпут
                    document.getElementById('envAmp' + i).value = val + '%';
                }
            }

            drawEnvelope();
        }

        function initAudio() {
            if (!audioContext || audioContext.state === 'closed') {

                masterGain = audioContext.createGain();
                masterGain.gain.value = 1.0;
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 2048;
                masterGain.connect(analyserNode);
                analyserNode.connect(audioContext.destination);
            }
        }

        // === STOP ALL SOUNDS ===
        function stopAllSounds() {
            if (levelAnimFrame) {
                cancelAnimationFrame(levelAnimFrame);
                levelAnimFrame = null;
            }
            
            const levelFill = document.getElementById('levelFill');
            const levelVal = document.getElementById('levelVal');
            if (levelFill) levelFill.style.width = '0%';
            if (levelVal) levelVal.textContent = '-∞ dB';

            for (let osc of activeOscillators) {
                try { osc.stop(); } catch(e) {}
                try { osc.disconnect(); } catch(e) {}
            }
            activeOscillators = [];
            
            isPlaying = false;
            document.getElementById('status').textContent = t('stopped');
            
            let output = document.getElementById('output');
            if (!output.textContent.includes('Stopped') && !output.textContent.includes('Остановлено')) {
                output.textContent = output.textContent + '\n' + '--- ' + t('stopped') + ' ---';
            }
        }

        // === LEVEL METER ===
        function updateLevelMeter() {
            if (!analyserNode || !isPlaying) return;

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Float32Array(bufferLength);
            const levelFill = document.getElementById('levelFill');
            const levelVal = document.getElementById('levelVal');

            function drawLevel() {
                if (!isPlaying || !analyserNode) {
                    levelFill.style.width = '0%';
                    levelVal.textContent = '-∞ dB';
                    return;
                }
                
                levelAnimFrame = requestAnimationFrame(drawLevel);

                analyserNode.getFloatTimeDomainData(dataArray);

                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i] * dataArray[i];
                }
                const rms = Math.sqrt(sum / bufferLength);

                let db = 20 * Math.log10(rms);
                if (db < -60) db = -60;
                if (db > 0) db = 0;

                const pct = ((db + 60) / 60) * 100;
                levelFill.style.width = pct + '%';

                if (db < -59) {
                    levelVal.textContent = '-∞ dB';
                } else {
                    levelVal.textContent = db.toFixed(1) + ' dB';
                }
            }

            drawLevel();
        }

        // === START FUNCTION ===
        function startAM() {
            initAudio();
            
            let carrierFreq = parseFloat(document.getElementById('carrierFreq').value);
            let modFreq1 = parseFloat(document.getElementById('modFreq1').value);
            let modFreq2 = parseFloat(document.getElementById('modFreq2').value);
            let depthAM = parseFloat(document.getElementById('depth').value) / 100;
            let fmDepth = parseFloat(document.getElementById('fmDepth').value);
            let duration = parseFloat(document.getElementById('duration').value);
            let masterVolume = parseFloat(document.getElementById('masterVolume').value) / 100;
            let h2On = document.getElementById('harmonics2Check').checked;
            let h3On = document.getElementById('harmonics3Check').checked;
            let h2Gain = parseFloat(document.getElementById('harmonics2Gain').value) / 100;
            let h3Gain = parseFloat(document.getElementById('harmonics3Gain').value) / 100;
            
            let when = audioContext.currentTime + 0.1;
            
            // --- НЕСУЩАЯ (carrier) ---
            let carrier = audioContext.createOscillator();
            carrier.frequency.value = carrierFreq;

            let modulator1 = audioContext.createOscillator();
            modulator1.frequency.value = modFreq1;

            let modulator2 = audioContext.createOscillator();
            modulator2.frequency.value = modFreq2;

            // --- FM для несущей ---
            let fmGain = audioContext.createGain();
            fmGain.gain.value = fmDepth * masterVolume;
            modulator2.connect(fmGain);
            fmGain.connect(carrier.frequency);

            // --- AM для несущей ---
            let gainNode = audioContext.createGain();
            gainNode.gain.value = 0.5 * masterVolume;

            let depthNode = audioContext.createGain();
            depthNode.gain.value = depthAM * 0.5 * masterVolume;

            modulator1.connect(depthNode);
            depthNode.connect(gainNode.gain);
            carrier.connect(gainNode);
            
            // --- НОВАЯ ОГИБАЮЩАЯ АМПЛИТУДЫ (AMPLITUDE ENVELOPE) ---
            let envelopeGain = audioContext.createGain();
            
            // Стартуем с нулевой амплитуды (Start from zero)
            envelopeGain.gain.setValueAtTime(0, when);

            // Проходим по массиву и планируем изменение громкости
            for (let i = 0; i < AMP_Envelope.length; i++) {
                // Вычисляем абсолютное время в секундах для этой точки
                let pointTime = when + (AMP_Envelope[i].x / 100) * duration;
                
                // Вычисляем значение усиления (от 0.0 до 1.0)
                let pointAmp = (AMP_Envelope[i].y / 100);
                
                // Web Audio API плавно изменит громкость к нужному времени
                envelopeGain.gain.linearRampToValueAtTime(pointAmp, pointTime);
            }

            // Подключаем сигнал: Carrier -> AM Mod -> Envelope -> Master
            gainNode.connect(envelopeGain);
            envelopeGain.connect(masterGain);
            let oscillators = [carrier, modulator1, modulator2];

            // --- ВТОРАЯ ГАРМОНИКА ---
            let harmonic2 = null;
            let harmonic2Gain = null;

            if (h2On && h2Gain > 0) {
                harmonic2 = audioContext.createOscillator();
                harmonic2.frequency.value = carrierFreq * 2;
                oscillators.push(harmonic2);
                
                harmonic2Gain = audioContext.createGain();
                harmonic2Gain.gain.value = h2Gain * masterVolume;
                
                // --- FM ДЛЯ ГАРМОНИКИ (используем ТОТ ЖЕ modulator2) ---
                let fmGainH2 = audioContext.createGain();
                fmGainH2.gain.value = fmDepth * masterVolume;
                modulator2.connect(fmGainH2);
                fmGainH2.connect(harmonic2.frequency);
                
                // --- AM ДЛЯ ГАРМОНИКИ (используем ТОТ ЖЕ depthNode) ---
                // Гармоника подключается к ТОМУ ЖЕ gainNode, что и несущая
                harmonic2.connect(harmonic2Gain);
                harmonic2Gain.connect(gainNode); // <- ИДЁТ В ТОТ ЖЕ AM
            }

            // --- ТРЕТЬЯ ГАРМОНИКА ---
            let harmonic3 = null;
            let harmonic3Gain = null;

            if (h3On && h3Gain > 0) {
                harmonic3 = audioContext.createOscillator();
                harmonic3.frequency.value = carrierFreq * 3;
                oscillators.push(harmonic3);
                
                harmonic3Gain = audioContext.createGain();
                harmonic3Gain.gain.value = h3Gain * masterVolume;
                
                // --- FM ДЛЯ ГАРМОНИКИ ---
                let fmGainH3 = audioContext.createGain();
                fmGainH3.gain.value = fmDepth * masterVolume;
                modulator2.connect(fmGainH3);
                fmGainH3.connect(harmonic3.frequency);
                
                // --- AM ДЛЯ ГАРМОНИКИ ---
                harmonic3.connect(harmonic3Gain);
                harmonic3Gain.connect(gainNode); // <- ТОТ ЖЕ AM
            }
            
            for (let osc of oscillators) {
                osc.start(when);
            }
            
            activeOscillators.push(...oscillators);
            isPlaying = true;

            updateLevelMeter();
            
            let stopTime = when + duration;
            for (let osc of oscillators) {
                osc.stop(stopTime);
            }
            
            setTimeout(() => {
                activeOscillators = activeOscillators.filter(o => !oscillators.includes(o));
                if (activeOscillators.length === 0) {
                    isPlaying = false;
                    const levelFill = document.getElementById('levelFill');
                    const levelVal = document.getElementById('levelVal');
                    if (levelFill) levelFill.style.width = '0%';
                    if (levelVal) levelVal.textContent = '-∞ dB';
                    if (levelAnimFrame) {
                        cancelAnimationFrame(levelAnimFrame);
                        levelAnimFrame = null;
                    }
                }
            }, duration * 1000 + 100);
            
            let h2Text = h2On ? '2nd: ' + (carrierFreq*2).toFixed(0) + ' Hz (' + (h2Gain*100).toFixed(0) + '%)' : '';
            let h3Text = h3On ? '3rd: ' + (carrierFreq*3).toFixed(0) + ' Hz (' + (h3Gain*100).toFixed(0) + '%)' : '';
            let harmonicsText = [h2Text, h3Text].filter(s => s).join(', ') || t('noHarmonics');
            
            let output = document.getElementById('output');

            let envText = AMP_Envelope.map((p, i) => `${i + 1}. ${(p.x / 100 * duration).toFixed(3)}s-${p.y.toFixed(1)}%`).join(' ');

            output.textContent = 
`Carrier: ${carrierFreq} Hz
OSC-1 (AM): ${modFreq1} Hz, depth ${(depthAM * 100).toFixed(0)}%
OSC-2 (FM): ${modFreq2} Hz, depth ${fmDepth} Hz
Duration: ${duration} sec
